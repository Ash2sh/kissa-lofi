[package]
name = "kissa"
version = "0.2.0-alpha.1"
description = "Whisper-quiet, 100% pure-Rust native lofi desktop café with dynamic WebAssembly plugins (zero WebView)"
authors = ["Ash2sh"]
license = "MIT"
repository = "https://github.com/Ash2sh/kissa-lofi"
homepage = "https://github.com/Ash2sh/kissa-lofi"
readme = "README.md"
keywords = ["lofi", "music", "egui", "wasm", "desktop"]
categories = ["multimedia::audio", "gui"]
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "ogg", "vorbis", "aac", "isomp4", "pcm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
rfd = "0.15"
dirs = "6"
arboard = "3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmi = "0.40"
wat = "1"
walkdir = "2"
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
