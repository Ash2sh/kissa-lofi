[package]
name = "lofi-rust-client"
version = "0.1.0-alpha.1"
description = "Kissa — Cross-platform, low-resource lofi desktop application with dynamic Wasm plugins"
authors = ["lofi-rust-client"]
edition = "2021"

[lib]
name = "lofi_rust_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmi = "0.40"
wat = "1"
walkdir = "2"
percent-encoding = "2"
mime_guess = "2"
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
